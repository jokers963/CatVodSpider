name: Check interface

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node js/adapters.test.cjs
          node js/new-sites.test.cjs
          node js/hanime1.nav.test.cjs
